# SonarQube Project Configuration
# This file is used to configure the analysis of your project by SonarQube

# Required metadata
sonar.projectKey=prosoc-api
sonar.projectName=Prosoc API
sonar.projectVersion=1.0.0

# Path to sources
sonar.sources=.
sonar.exclusions=**/bin/**,**/obj/**,**/packages/**,**/node_modules/**,**/*.csproj,**/*.sln,**/.git/**,**/.vs/**,**/*.Designer.cs,**/*.Generated.cs,**/*.g.cs,**/*.g.i.cs

# Path to tests
sonar.tests=**/Tests/**/*.cs,**/*Tests.cs

# Coverage exclusions (files to exclude from coverage analysis)
sonar.coverage.exclusions=**/Program.cs,**/Startup.cs,**/Migrations/**,**/*Tests.cs,**/TestHelpers/**,**/Factories/**,**/Fixtures/**

# Source encoding
sonar.sourceEncoding=UTF-8

# C# specific properties
sonar.cs.roslyn.reportFilePath=**/*.roslyn.json
sonar.cs.analyzer.projectOutPaths=**/*.roslyn.json

# Code quality thresholds
sonar.qualitygate.wait=true

# Additional exclusions for specific rules
sonar.issue.ignore.multicriteria=e1,e2,e3

# Exclude files with generated code
sonar.issue.ignore.multicriteria.e1.ruleKey=cs:S107
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.g.cs,**/*.g.i.cs,**/*.Designer.cs

# Exclude test files from certain rules
sonar.issue.ignore.multicriteria.e2.ruleKey=cs:S101,cs:S1067
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*Tests.cs,**/Test*.cs

# Exclude migration files
sonar.issue.ignore.multicriteria.e3.ruleKey=cs:S101,cs:S1128
sonar.issue.ignore.multicriteria.e3.resourceKey=**/Migrations/**/*.cs

# Duplication settings
sonar.cpd.exclusions=**/Tests/**,**/*Tests.cs,**/TestHelpers/**,**/Factories/**,**/Fixtures/**

# Size metrics
sonar.scm.provider=git

# JavaScript/TypeScript (if applicable)
sonar.javascript.exclusions=**/node_modules/**,**/dist/**,**/build/**
sonar.typescript.exclusions=**/node_modules/**,**/dist/**,**/build/**

# HTML/CSS (if applicable)
sonar.html.exclusions=**/node_modules/**,**/dist/**
sonar.css.exclusions=**/node_modules/**,**/dist/**

# XML (if applicable)
sonar.xml.exclusions=**/bin/**,**/obj/**,**/packages/**

# Security settings
sonar.security.hotspots.enabled=true

# Additional analysis parameters
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.dotnet.coverage.exclusions=**/Tests/**,**/*Tests.cs

# Test execution reports
sonar.junit.reportsPaths=**/test-results/**/*.xml
sonar.dotnet.junit.reportsPaths=**/test-results/**/*.xml

# Build breaker - fail build if quality gate fails
sonar.qualitygate.wait=true
